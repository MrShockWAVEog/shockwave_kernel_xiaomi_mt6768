name: Build kernel (lancelot / MT6768)

# Manual trigger only. Build artifacts are uploaded for manual review; nothing is flashed.
on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig path relative to arch/arm64/configs"
        required: false
        default: "vendor/mt6768_defconfig"
      clang_url:
        description: "Custom clang archive URL (.tar.gz/.tar.xz/.zip). Blank = AOSP prebuilt chosen below"
        required: false
        default: ""
      aosp_clang_branch:
        description: "AOSP prebuilts/clang branch (used when clang_url is blank)"
        required: false
        default: "android13-release"
      aosp_clang_version:
        description: "AOSP clang directory name (used when clang_url is blank)"
        required: false
        default: "clang-r450784d"
      config_fragment:
        description: "Config fragment (path inside the repo) merged after the defconfig; blank = none"
        required: false
        default: "arch/arm64/configs/vendor/lancelot.config"
      extra_config:
        description: "Optional extra options, comma separated, e.g. CONFIG_FOO=y,CONFIG_BAR=n"
        required: false
        default: ""
      make_targets:
        description: "Optional make targets, space separated (blank = default target)"
        required: false
        default: ""
      extra_make_args:
        description: "Optional extra make arguments, e.g. LD=aarch64-linux-gnu-ld.bfd (applied last, so they override)"
        required: false
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential libssl-dev libelf-dev libncurses-dev \
            cpio rsync lz4 xz-utils zip unzip curl ca-certificates git \
            python3 python-is-python3 device-tree-compiler dwarves \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Resolve clang source
        id: clang
        env:
          IN_URL: ${{ inputs.clang_url }}
          IN_BRANCH: ${{ inputs.aosp_clang_branch }}
          IN_VERSION: ${{ inputs.aosp_clang_version }}
        run: |
          if [ -n "$IN_URL" ]; then
            url="$IN_URL"
          else
            url="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/${IN_BRANCH}/${IN_VERSION}.tar.gz"
          fi
          key="clang-$(printf '%s' "$url" | sha256sum | cut -c1-16)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "Clang source: $url"

      - name: Cache clang
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ~/clang
          key: ${{ steps.clang.outputs.key }}

      - name: Download clang
        if: steps.clang-cache.outputs.cache-hit != 'true'
        env:
          CLANG_URL: ${{ steps.clang.outputs.url }}
        run: |
          mkdir -p ~/clang
          curl -fL --retry 5 --retry-delay 5 -o /tmp/clang.pkg "$CLANG_URL"
          case "$CLANG_URL" in
            *.zip) unzip -q /tmp/clang.pkg -d ~/clang ;;
            *)     tar -xf /tmp/clang.pkg -C ~/clang ;;
          esac
          rm -f /tmp/clang.pkg

      - name: Locate clang
        run: |
          clang_bin="$(find ~/clang -maxdepth 4 -name clang \( -type f -o -type l \) -path '*/bin/*' | head -n1)"
          if [ -z "$clang_bin" ]; then
            echo "::error::clang binary not found in the toolchain archive"
            exit 1
          fi
          dirname "$clang_bin" >> "$GITHUB_PATH"
          "$clang_bin" --version

      - name: Detect defconfig and kernel version
        env:
          IN_DEFCONFIG: ${{ inputs.defconfig }}
        run: |
          cfgdir=arch/arm64/configs
          if [ ! -d "$cfgdir" ]; then
            echo "::error::$cfgdir not found - is this an arm64 kernel tree?"
            exit 1
          fi

          if [ -n "$IN_DEFCONFIG" ]; then
            defconfig="$IN_DEFCONFIG"
            if [ ! -f "$cfgdir/$defconfig" ] && [ -f "$cfgdir/${defconfig}_defconfig" ]; then
              defconfig="${defconfig}_defconfig"
            fi
          else
            if [ -f "$cfgdir/vendor/mt6768_defconfig" ]; then
              defconfig="vendor/mt6768_defconfig"
            else
              echo "::error::vendor/mt6768_defconfig not found. Re-run with the 'defconfig' input."
              echo "Candidates under $cfgdir:"
              find "$cfgdir" -iname '*lancelot*' -o -iname '*mt6768*' | sed "s|$cfgdir/||"
              exit 1
            fi
          fi

          if [ ! -f "$cfgdir/$defconfig" ]; then
            echo "::error::Defconfig not found: $cfgdir/$defconfig"
            exit 1
          fi

          kver="$(make -s kernelversion)"
          echo "DEFCONFIG=$defconfig" >> "$GITHUB_ENV"
          echo "KERNEL_VERSION=$kver" >> "$GITHUB_ENV"
          echo "Using defconfig: $defconfig (kernel $kver)"

      - name: Patch dtc yylloc (host GCC 10+ fix, runner copy only)
        run: |
          for f in scripts/dtc/dtc-lexer.l scripts/dtc/dtc-lexer.lex.c_shipped; do
            if [ -f "$f" ]; then
              sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' "$f"
            fi
          done

      - name: Build kernel
        env:
          IN_FRAGMENT: ${{ inputs.config_fragment }}
          IN_EXTRA_CONFIG: ${{ inputs.extra_config }}
          IN_TARGETS: ${{ inputs.make_targets }}
          IN_EXTRA_ARGS: ${{ inputs.extra_make_args }}
          KBUILD_BUILD_USER: github-actions
          KBUILD_BUILD_HOST: ubuntu
        run: |
          set -euo pipefail
          : > build.log
          run() { echo "+ $*" | tee -a build.log; "$@" 2>&1 | tee -a build.log; }

          export ARCH=arm64
          export SUBARCH=arm64

          MAKE_ARGS=(
            O=out
            ARCH=arm64
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            READELF=llvm-readelf
            OBJSIZE=llvm-size
            STRIP=llvm-strip
          )

          # 1. clean
          run make mrproper
          rm -rf out

          # 2. defconfig
          run make "${MAKE_ARGS[@]}" "$DEFCONFIG"

          # 3. optional fragment merge
          frag="$RUNNER_TEMP/extra.config"
          : > "$frag"
          if [ -n "$IN_FRAGMENT" ]; then
            if [ ! -f "$IN_FRAGMENT" ]; then
              echo "::error::config_fragment not found: $IN_FRAGMENT"
              exit 1
            fi
            cat "$IN_FRAGMENT" >> "$frag"
            echo >> "$frag"
          fi
          if [ -n "$IN_EXTRA_CONFIG" ]; then
            tr ',' '\n' <<< "$IN_EXTRA_CONFIG" \
              | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
              | grep -v '^$' >> "$frag" || true
          fi
          if [ -s "$frag" ]; then
            echo "--- merging config fragment ---" | tee -a build.log
            tee -a build.log < "$frag"
            run scripts/kconfig/merge_config.sh -m -O out out/.config "$frag"
          fi

          # 4. resolve new symbols
          run make "${MAKE_ARGS[@]}" olddefconfig

          # 5. build
          targets=()
          if [ -n "$IN_TARGETS" ]; then
            read -r -a targets <<< "$IN_TARGETS"
          fi
          extra=()
          if [ -n "$IN_EXTRA_ARGS" ]; then
            read -r -a extra <<< "$IN_EXTRA_ARGS"
          fi

          date -u | tee -a build.log
          run make "${MAKE_ARGS[@]}" -j"$(nproc --all)" "${targets[@]}" "${extra[@]}"
          date -u | tee -a build.log

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p dist/dtb
          cp build.log dist/ 2>/dev/null || true
          cp out/.config dist/config.txt 2>/dev/null || true
          cp out/include/config/kernel.release dist/ 2>/dev/null || true

          if [ -d out/arch/arm64/boot ]; then
            find out/arch/arm64/boot -maxdepth 1 -type f \
              \( -name 'Image*' -o -name 'dtbo.img' -o -name '*.dtb' \) \
              -exec cp -v {} dist/ \;
            if [ -d out/arch/arm64/boot/dts ]; then
              find out/arch/arm64/boot/dts -type f -name '*.dtb' -exec cp {} dist/dtb/ \;
            fi
          fi

          {
            echo "repo:       $GITHUB_REPOSITORY"
            echo "ref:        $GITHUB_REF_NAME"
            echo "commit:     $GITHUB_SHA"
            echo "defconfig:  ${DEFCONFIG:-unknown}"
            echo "kernel:     ${KERNEL_VERSION:-unknown}"
            echo "clang:      $(clang --version 2>/dev/null | head -n1 || echo unknown)"
            echo "built (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > dist/BUILD_INFO.txt

          (cd dist && find . -type f ! -name SHA256SUMS -exec sha256sum {} + > SHA256SUMS)
          ls -la dist

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lancelot-kernel-${{ github.run_number }}
          path: dist/
          retention-days: 14
          if-no-files-found: warn

      - name: Verify kernel image was produced
        run: |
          if ! ls dist/Image* >/dev/null 2>&1; then
            echo "::error::No kernel Image was produced. Check build.log in the artifact."
            exit 1
          fi
